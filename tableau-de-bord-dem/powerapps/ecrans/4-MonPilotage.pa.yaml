              =Set(gFenetre, Self.Selected.Value)
            X: =140
            Y: =212
            Width: =240
            Height: =36
            Size: =12
      - GelTitre:
          Control: Label
          Properties:
            Text: |-
              ="Gel M0 à passer (J0 − 70 j) · " & Text(CountRows(galGel.AllItems)) & " REE"
            X: =40
            Y: =262
            Width: =(Parent.Width - 104) / 2
            Height: =30
            Size: =15
            Color: |-
              =RGBA(0, 26, 112, 1)
      - galGel:
          Control: Gallery
          Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
          Properties:
            Items: |-
              =Sort(Filter(AddColumns(GroupBy(Filter(tMes, !Gelee && !IsBlank(GelM0)), Affaire, REE, Lignes), Gel, Min(Lignes, GelM0), Libelle1, First(Lignes).LibelleREE, Manque, First(Lignes).ManqueGel, NbLignes, CountRows(Lignes)), Switch(ddFenetre.Selected.Value, "Moins de 30 jours", Gel < DateAdd(Today(), 30), "30 à 90 jours", Gel >= DateAdd(Today(), 30) && Gel < DateAdd(Today(), 90), "Plus tard", Gel >= DateAdd(Today(), 90), true)), Gel, SortOrder.Ascending)
            TemplateSize: =58
            TemplatePadding: =0
            X: =40
            Y: =298
            Width: =(Parent.Width - 104) / 2
            Height: =Parent.Height - 318
            Fill: |-
              =RGBA(220, 226, 234, 1)
            ShowScrollbar: =true
          Children:
            - GelFond:
                Control: Rectangle
                Properties:
                  X: =0
                  Y: =0
                  Width: =Parent.TemplateWidth
                  Height: =Parent.TemplateHeight - 1
                  Fill: |-
                    =RGBA(255, 255, 255, 1)
            - GelRee:
                Control: Label
                Properties:
                  Text: |-
                    =ThisItem.Affaire & " · REE " & ThisItem.REE
                  X: =16
                  Y: =6
                  Width: =Parent.TemplateWidth - 180
                  Height: =24
                  Size: =13
                  Color: |-
                    =RGBA(16, 87, 200, 1)
            - GelLib:
                Control: Label
                Properties:
                  Text: |-
                    ="Manque " & ThisItem.Manque & " · " & Text(ThisItem.NbLignes) & " TOT · " & ThisItem.Libelle1
                  X: =16
                  Y: =30
                  Width: =Parent.TemplateWidth - 180
                  Height: =22
                  Size: =11
                  Color: |-
                    =RGBA(90, 102, 120, 1)
            - GelDate:
                Control: Label
                Properties:
                  Text: |-
                    =Text(ThisItem.Gel, "dd/mm/yyyy")
                  X: =Parent.TemplateWidth - 160
                  Y: =6
                  Width: =144
                  Height: =46
                  Size: =12
                  Color: |-
                    =RGBA(0, 26, 112, 1)
                  Align: =Align.Right
